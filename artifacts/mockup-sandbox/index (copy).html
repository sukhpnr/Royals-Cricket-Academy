<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royals Cricket Academy</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="app">
        <div id="login-screen" class="container">
            <img src="https://blogger.googleusercontent.com/img/b/R290ZWxl/AVvXsEjP9Y6p6u8Y0-v8S9v9Z1Qp0_Y8-v8Z1Qp0_Y8/s1600/logo.png" alt="Logo" class="logo">
            <h2>ROYALS CRICKET ACADEMY</h2>
            <p>Jalandhar | 76963-72777</p>

            <div class="button-group">
                <button onclick="showAdminLogin()" class="btn">Admin Login</button>
                <button onclick="showPlayerLogin()" class="btn">Player Portal</button>
            </div>
        </div>

        <div id="admin-section" class="container" style="display:none;">
            <h3>Admin Access</h3>
            <input type="password" id="adminPin" placeholder="Enter PIN">
            <button onclick="handleAdminLogin()" class="btn">Verify</button>
            <button onclick="goBack()" class="btn-back">Back</button>
        </div>

        <div id="player-section" class="container" style="display:none;">
            <h3>Player Login</h3>
            <input type="number" id="playerPhone" placeholder="Enter Mobile Number">
            <button onclick="handlePlayerLogin()" class="btn">Login</button>
            <button onclick="goBack()" class="btn-back">Back</button>
        </div>

        <div id="dashboard" class="container" style="display:none;">
            <h3 id="welcomeMsg">Welcome</h3>
            <div id="userData"></div>
            <button onclick="logout()" class="btn-back">Logout</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
